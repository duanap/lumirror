name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Check EdgeOne function syntax
        run: npm run check:functions

      - name: Run API smoke tests
        run: npm run test:api

      - name: Run server smoke tests
        run: npm run test:server

      - name: Run optimization regression tests
        run: npm run test:optimization

      - name: Run deployment configuration contract
        run: npm run test:deployment

      - name: Run HTTP concurrency gate
        run: npm run test:r2:http-concurrency

      - name: Run repository concurrency gate
        run: npm run test:r2:repository-concurrency

      - name: Run queue removal contract
        run: npm run test:r2:queue-removal

      - name: Run R2 golden behavior tests
        run: npm run test:golden

      - name: Run R2 domain closeout tests
        run: npm run test:r2:domain-closeout

      - name: Enforce normal snapshot mutation zero
        run: npm run check:snapshot-usage -- --expect-clean

      - name: Build production assets
        run: npm run build

      - name: Validate documentation links
        run: npm run docs:validate

      - name: Build documentation center
        run: npm run docs:build
