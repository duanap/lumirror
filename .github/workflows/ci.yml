name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EdgeOne function syntax
        run: npm run check:functions

      - name: Run API smoke tests
        run: npm run test:api

      - name: Run server smoke tests
        run: npm run test:server

      - name: Build production assets
        run: npm run build
